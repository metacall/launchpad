name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Format · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run unit

      - run: npm run build

      - run: npm ci
        working-directory: cli

      - run: npm run build
        working-directory: cli

      - run: npm test
        working-directory: cli

      - name: Check the package contents
        working-directory: cli
        run: |
          files=$(npm pack --dry-run --json | jq -r '.[0].files[].path')
          echo "$files"
          echo "$files" | grep -qx 'dist/index.js'
          echo "$files" | grep -qx 'dist/public/index.html'
          if echo "$files" | grep -E '\.(map|mp4)$|^src/|^dist/test/'; then
            echo "These files should not be published"
            exit 1
          fi

      - name: Smoke test the server
        run: |
          node cli/dist/index.js --version | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'
          node cli/dist/index.js &
          trap "kill $!" EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:9001/__launchpad/config | grep -q '"mode":"local"'
          curl -fsS -H 'Accept: text/html' http://localhost:9001/ | grep -q '<div id="root">'
          curl -fsS -H 'Accept: text/html' http://localhost:9001/deployments | grep -q '<div id="root">'
